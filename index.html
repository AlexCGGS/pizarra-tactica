<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pizarra Táctica - Fútbol Americano</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Prevención estricta de scroll/refresh al arrastrar o dibujar en móvil */
    html, body {
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      background-color: #0f172a;
    }
    
    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .color-swatch:active {
      transform: scale(0.9);
    }
    .color-swatch.active {
      border-color: #ffffff;
      transform: scale(1.15);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }
    
    /* Scrollbar estilizada para barra de herramientas en móvil */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col text-white font-sans overflow-hidden select-none">

  <!-- BARRA DE HERRAMIENTAS SUPERIOR -->
  <header class="bg-slate-900 border-b border-slate-800 p-2 sm:p-3 flex flex-col gap-2 shadow-lg z-20">
    <div class="flex items-center justify-between gap-2 flex-wrap">
      
      <!-- TÍTULO -->
      <div class="flex items-center gap-2">
        <span class="text-xl">🏈</span>
        <h1 class="font-bold text-base sm:text-lg tracking-wide text-slate-100">Pizarra Táctica</h1>
      </div>

      <!-- SELECTOR DE FORMACIONES -->
      <div class="flex items-center gap-2 flex-wrap text-xs sm:text-sm">
        <div class="flex items-center gap-1 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700">
          <label for="offense-select" class="text-amber-400 font-semibold">Ataque:</label>
          <select id="offense-select" class="bg-slate-900 text-white rounded px-2 py-1 outline-none font-medium cursor-pointer">
            <option value="EMPTY">EMPTY</option>
            <option value="DIAMOND">DIAMOND</option>
            <option value="SPREAD" selected>SPREAD</option>
            <option value="TRIPS">TRIPS</option>
            <option value="BUNCH">BUNCH</option>
            <option value="GUN_DOUBLES">GUN DOUBLES</option>
            <option value="TRAY">TRAY</option>
            <option value="TRIO">TRIO</option>
            <option value="GUN_SNUGS">GUN SNUGS</option>
            <option value="GUN_ACE">GUN ACE</option>
            <option value="I_FORM_STRONG_TIGHT">I-FORM STRONG TIGHT</option>
            <option value="I_FORM_TIGHT">I-FORM TIGHT</option>
            <option value="I_FORM">I-FORM</option>
            <option value="GUN_SPLIT">GUN SPLIT</option>
            <option value="GUN_PRO">GUN PRO</option>
            <option value="I_FORM_WING">I-FORM WING</option>
          </select>
        </div>

        <div class="flex items-center gap-1 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700">
          <label for="defense-select" class="text-red-400 font-semibold">Defensa:</label>
          <select id="defense-select" class="bg-slate-900 text-white rounded px-2 py-1 outline-none font-medium cursor-pointer">
            <option value="DEF_43">4-3 Base</option>
            <option value="DEF_34">3-4 Base</option>
            <option value="DEF_NICKEL">Nickel 4-2-5</option>
            <option value="DEF_COVER2">Cover 2</option>
            <option value="DEF_NONE">Sin Defensa</option>
          </select>
        </div>
      </div>

      <!-- BOTONES DE ACCIÓN -->
      <div class="flex items-center gap-2">
        <button id="btn-clear-draw" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-semibold px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1">
          <span>✏️</span> Limpiar Trazos
        </button>
        <button id="btn-reset-board" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-semibold px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1">
          <span>🔄</span> Resetear
        </button>
        <button id="btn-download" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs sm:text-sm font-bold px-3 py-1.5 rounded-lg shadow transition flex items-center gap-1">
          <span>📷</span> Captura
        </button>
      </div>
    </div>

    <!-- SEGUNDA FILA: CONTROLES DE DIBUJO Y SELECCIÓN DE COLORES -->
    <div class="flex items-center justify-between gap-3 overflow-x-auto no-scrollbar pt-1 border-t border-slate-800 text-xs sm:text-sm">
      
      <!-- MODOS: MOVER / DIBUJAR / BORRADOR -->
      <div class="flex items-center gap-1 bg-slate-800 p-1 rounded-lg border border-slate-700 shrink-0">
        <button id="mode-move" class="mode-btn bg-blue-600 text-white font-bold px-3 py-1 rounded-md transition flex items-center gap-1">
          <span>✋</span> Mover
        </button>
        <button id="mode-draw" class="mode-btn text-slate-300 font-medium px-3 py-1 rounded-md hover:text-white transition flex items-center gap-1">
          <span>✏️</span> Dibujar
        </button>
        <button id="mode-erase" class="mode-btn text-slate-300 font-medium px-3 py-1 rounded-md hover:text-white transition flex items-center gap-1">
          <span>🧹</span> Borrar
        </button>
      </div>

      <!-- TIPO DE LÍNEA -->
      <div class="flex items-center gap-1 bg-slate-800 p-1 rounded-lg border border-slate-700 shrink-0">
        <button id="style-arrow" class="style-btn bg-slate-700 text-white px-2.5 py-1 rounded transition font-bold" title="Línea con flecha">
          ➔ Flecha
        </button>
        <button id="style-solid" class="style-btn text-slate-300 hover:text-white px-2.5 py-1 rounded transition" title="Línea continua">
          ― Continua
        </button>
        <button id="style-dashed" class="style-btn text-slate-300 hover:text-white px-2.5 py-1 rounded transition" title="Línea discontinua">
          - - Discontinua
        </button>
      </div>

      <!-- PALETA DE COLORES DE TRAZO -->
      <div class="flex items-center gap-2 shrink-0 bg-slate-800 px-3 py-1 rounded-lg border border-slate-700">
        <span class="text-slate-400 font-medium text-xs">Color:</span>
        <div class="flex items-center gap-1.5" id="color-palette">
          <button class="color-swatch active" style="background-color: #facc15;" data-color="#facc15" title="Amarillo"></button>
          <button class="color-swatch" style="background-color: #ef4444;" data-color="#ef4444" title="Rojo"></button>
          <button class="color-swatch" style="background-color: #ffffff;" data-color="#ffffff" title="Blanco"></button>
          <button class="color-swatch" style="background-color: #38bdf8;" data-color="#38bdf8" title="Azul claro"></button>
          <button class="color-swatch" style="background-color: #4ade80;" data-color="#4ade80" title="Verde"></button>
          <button class="color-swatch" style="background-color: #fb923c;" data-color="#fb923c" title="Naranja"></button>
          <button class="color-swatch" style="background-color: #111827;" data-color="#111827" title="Negro"></button>
        </div>
        <!-- Selector de color personalizado -->
        <input type="color" id="custom-color-picker" value="#facc15" class="w-6 h-6 rounded cursor-pointer border-0 bg-transparent p-0" title="Color personalizado">
      </div>

      <!-- GROSOR DE TRAZO -->
      <div class="flex items-center gap-2 shrink-0 bg-slate-800 px-3 py-1 rounded-lg border border-slate-700">
        <span class="text-slate-400 font-medium text-xs">Grosor:</span>
        <select id="line-width-select" class="bg-slate-900 text-white rounded px-2 py-0.5 outline-none font-medium">
          <option value="3">Fino</option>
          <option value="6" selected>Medio</option>
          <option value="10">Grueso</option>
        </select>
      </div>

    </div>
  </header>

    <canvas id="tactics-board" class="w-full h-full rounded-xl shadow-2xl touch-none border border-slate-800"></canvas>

    // --- FORMACIONES DEFENSIVAS BASE ---
    const DEFENSIVE_FORMATIONS = {
      DEF_43: {
        name: "4-3 Base",
        players: [
          { id: "d1", label: "DE", x: 38, y: 26, type: "DEF" },
          { id: "d2", label: "DT", x: 46, y: 26, type: "DEF" },
          { id: "d3", label: "DT", x: 54, y: 26, type: "DEF" },
          { id: "d4", label: "DE", x: 62, y: 26, type: "DEF" },
          { id: "d5", label: "WLB",x: 32, y: 20, type: "DEF" },
          { id: "d6", label: "MLB",x: 50, y: 20, type: "DEF" },
          { id: "d7", label: "SLB",x: 68, y: 20, type: "DEF" },
          { id: "d8", label: "CB", x: 8,  y: 22, type: "DEF" },
          { id: "d9", label: "CB", x: 92, y: 22, type: "DEF" },
          { id: "d10",label: "FS", x: 35, y: 10, type: "DEF" },
          { id: "d11",label: "SS", x: 65, y: 12, type: "DEF" }
        ]
      },
      DEF_34: {
        name: "3-4 Base",
        players: [
          { id: "d1", label: "DE", x: 40, y: 26, type: "DEF" },
          { id: "d2", label: "NT", x: 50, y: 26, type: "DEF" },
          { id: "d3", label: "DE", x: 60, y: 26, type: "DEF" },
          { id: "d4", label: "LOLB",x: 30,y: 22, type: "DEF" },
          { id: "d5", label: "LILB",x: 44,y: 19, type: "DEF" },
          { id: "d6", label: "RILB",x: 56,y: 19, type: "DEF" },
          { id: "d7", label: "ROLB",x: 70,y: 22, type: "DEF" },
          { id: "d8", label: "CB",  x: 8, y: 22, type: "DEF" },
          { id: "d9", label: "CB",  x: 92,y: 22, type: "DEF" },
          { id: "d10",label: "FS",  x: 38,y: 10, type: "DEF" },
          { id: "d11",label: "SS",  x: 62,y: 10, type: "DEF" }
        ]
      },
      DEF_NICKEL: {
        name: "Nickel 4-2-5",
        players: [
          { id: "d1", label: "DE", x: 38, y: 26, type: "DEF" },
          { id: "d2", label: "DT", x: 46, y: 26, type: "DEF" },
          { id: "d3", label: "DT", x: 54, y: 26, type: "DEF" },
          { id: "d4", label: "DE", x: 62, y: 26, type: "DEF" },
          { id: "d5", label: "MLB",x: 44, y: 20, type: "DEF" },
          { id: "d6", label: "WLB",x: 56, y: 20, type: "DEF" },
          { id: "d7", label: "NCB",x: 24, y: 22, type: "DEF" },
          { id: "d8", label: "CB", x: 8,  y: 22, type: "DEF" },
          { id: "d9", label: "CB", x: 92, y: 22, type: "DEF" },
          { id: "d10",label: "FS", x: 35, y: 10, type: "DEF" },
          { id: "d11",label: "SS", x: 65, y: 12, type: "DEF" }
        ]
      },
      DEF_COVER2: {
        name: "Cover 2",
        players: [
          { id: "d1", label: "DE", x: 38, y: 26, type: "DEF" },
          { id: "d2", label: "DT", x: 46, y: 26, type: "DEF" },
          { id: "d3", label: "DT", x: 54, y: 26, type: "DEF" },
          { id: "d4", label: "DE", x: 62, y: 26, type: "DEF" },
          { id: "d5", label: "WLB",x: 32, y: 21, type: "DEF" },
          { id: "d6", label: "MLB",x: 50, y: 21, type: "DEF" },
          { id: "d7", label: "SLB",x: 68, y: 21, type: "DEF" },
          { id: "d8", label: "CB", x: 8,  y: 23, type: "DEF" },
          { id: "d9", label: "CB", x: 92, y: 23, type: "DEF" },
          { id: "d10",label: "FS", x: 28, y: 8,  type: "DEF" },
          { id: "d11",label: "SS", x: 72, y: 8,  type: "DEF" }
        ]
      },
      DEF_NONE: {
        name: "Sin Defensa",
        players: []
      }
    };

    // ESTADO DE LA APLICACIÓN
    const canvas = document.getElementById("tactics-board");
    const ctx = canvas.getContext("2d");

    let currentOffenseKey = "SPREAD";
    let currentDefenseKey = "DEF_43";
    let activeMode = "move"; // 'move', 'draw', 'erase'
    let lineStyle = "arrow";  // 'arrow', 'solid', 'dashed'
    let strokeColor = "#facc15"; // Amarillo por defecto
    let strokeWidth = 6;

    let players = [];
    let drawings = []; // Array de trazados
    let currentPath = null;
    let draggedPlayer = null;
    let touchOffset = { x: 0, y: 0 };

    // INICIALIZACIÓN Y ESCALADO
    function resizeCanvas() {
      const container = document.getElementById("board-container");
      const rect = container.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      
      ctx.scale(dpr, dpr);
      render();
    }

    function initBoard() {
      loadFormations(currentOffenseKey, currentDefenseKey);
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();
    }

    function loadFormations(offKey, defKey) {
      const offList = OFFENSIVE_FORMATIONS[offKey]?.players || [];
      const defList = DEFENSIVE_FORMATIONS[defKey]?.players || [];
      
      // Clonar para permitir mover individualmente
      players = [
        ...offList.map(p => ({ ...p, side: "offense" })),
        ...defList.map(p => ({ ...p, side: "defense" }))
      ];
    }

    // DIBUJO DEL CAMPO Y JUGADORES
    function render() {
      const w = canvas.width / (window.devicePixelRatio || 1);
      const h = canvas.height / (window.devicePixelRatio || 1);

      // Fondo del campo de juego (Césped verde táctico)
      ctx.fillStyle = "#1e3a1e";
      ctx.fillRect(0, 0, w, h);

      // Franjar alternas de césped
      ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
      const stripWidth = w / 10;
      for (let i = 0; i < 10; i += 2) {
        ctx.fillRect(i * stripWidth, 0, stripWidth, h);
      }

      // Líneas de campo (Blancas tácticas)
      ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
      ctx.lineWidth = 2;

      // Líneas laterales
      ctx.strokeRect(10, 10, w - 20, h - 20);

      // Línea de scrimmage (Amarillo dorado de scrimmage)
      const losY = h * 0.30;
      ctx.strokeStyle = "#eab308";
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(10, losY);
      ctx.lineTo(w - 10, losY);
      ctx.stroke();
      ctx.setLineDash([]); // Reset dash

      // Marcas de Yardas horizontales
      ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
      ctx.lineWidth = 1.5;
      for (let yRatio = 0.1; yRatio < 1; yRatio += 0.1) {
        const y = h * yRatio;
        ctx.beginPath();
        ctx.moveTo(10, y);
        ctx.lineTo(w - 10, y);
        ctx.stroke();
      }

      // DIBUJAR TRAZOS DE RUTAS
      drawings.forEach(path => drawPath(path));
      if (currentPath) drawPath(currentPath);

      // DIBUJAR JUGADORES
      players.forEach(p => drawPlayer(p, w, h));
    }

    function drawPath(path) {
      if (path.points.length < 2) return;

      ctx.beginPath();
      ctx.strokeStyle = path.color;
      ctx.lineWidth = path.width;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      if (path.style === "dashed") {
        ctx.setLineDash([10, 8]);
      } else {
        ctx.setLineDash([]);
      }

      ctx.moveTo(path.points[0].x, path.points[0].y);
      for (let i = 1; i < path.points.length; i++) {
        ctx.lineTo(path.points[i].x, path.points[i].y);
      }
      ctx.stroke();
      ctx.setLineDash([]); // Restablecer

      // Punta de flecha si el estilo es 'arrow'
      if (path.style === "arrow" && path.points.length >= 2) {
        const p1 = path.points[path.points.length - 2];
        const p2 = path.points[path.points.length - 1];
        const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
        const headLen = path.width * 2.5 + 6;

        ctx.beginPath();
        ctx.fillStyle = path.color;
        ctx.moveTo(p2.x, p2.y);
        ctx.lineTo(
          p2.x - headLen * Math.cos(angle - Math.PI / 6),
          p2.y - headLen * Math.sin(angle - Math.PI / 6)
        );
        ctx.lineTo(
          p2.x - headLen * Math.cos(angle + Math.PI / 6),
          p2.y - headLen * Math.sin(angle + Math.PI / 6)
        );
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawPlayer(p, w, h) {
      const px = (p.x / 100) * w;
      const py = (p.y / 100) * h;
      const radius = Math.min(w, h) * 0.022 + 8; // Adaptativo para pantallas táctiles

      ctx.shadowBlur = 6;
      ctx.shadowColor = "rgba(0,0,0,0.5)";

      if (p.side === "offense") {
        if (p.type === "CENTER") {
          // El Centro se representa con un Cuadrado con X dentro (Estándar de Playbook)
          const size = radius * 1.8;
          ctx.fillStyle = "#2563eb"; // Azul
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 2.5;
          ctx.fillRect(px - size/2, py - size/2, size, size);
          ctx.strokeRect(px - size/2, py - size/2, size, size);

          // X interior
          ctx.beginPath();
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 2;
          ctx.moveTo(px - size/3, py - size/3);
          ctx.lineTo(px + size/3, py + size/3);
          ctx.moveTo(px + size/3, py - size/3);
          ctx.lineTo(px - size/3, py + size/3);
          ctx.stroke();
        } else {
          // Atacantes: Círculo Azul con borde blanco
          ctx.beginPath();
          ctx.arc(px, py, radius, 0, Math.PI * 2);
          ctx.fillStyle = "#2563eb";
          ctx.fill();
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = "#ffffff";
          ctx.stroke();

          // Texto de la Posición
          ctx.fillStyle = "#ffffff";
          ctx.font = `bold ${Math.max(11, radius * 0.85)}px sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(p.label, px, py + 1);
        }
      } else {
        // Defensores: Círculo Rojo/Sombra con texto blanco
        ctx.beginPath();
        ctx.arc(px, py, radius, 0, Math.PI * 2);
        ctx.fillStyle = "#dc2626"; // Rojo
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = `bold ${Math.max(10, radius * 0.75)}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(p.label, px, py + 1);
      }

      ctx.shadowBlur = 0; // Reset sombra
    }

    // MANEJO DE EVENTOS (MOUSE & TOUCH FLUIDO)
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function handleStart(e) {
      e.preventDefault();
      const coords = getCanvasCoords(e);
      const w = canvas.width / (window.devicePixelRatio || 1);
      const h = canvas.height / (window.devicePixelRatio || 1);

      if (activeMode === "move") {
        // Detectar si tocamos una ficha
        const hitRadius = Math.min(w, h) * 0.04 + 10;
        for (let i = players.length - 1; i >= 0; i--) {
          const p = players[i];
          const px = (p.x / 100) * w;
          const py = (p.y / 100) * h;
          const dist = Math.hypot(coords.x - px, coords.y - py);
          if (dist <= hitRadius) {
            draggedPlayer = p;
            touchOffset = { x: coords.x - px, y: coords.y - py };
            break;
          }
        }
      } else if (activeMode === "draw") {
        currentPath = {
          color: strokeColor,
          width: parseInt(strokeWidth, 10),
          style: lineStyle,
          points: [coords]
        };
      } else if (activeMode === "erase") {
        // Borrar trazo más cercano al toque
        eraseNearestPath(coords);
      }
    }

    function handleMove(e) {
      if (!draggedPlayer && !currentPath) return;
      e.preventDefault();
      const coords = getCanvasCoords(e);
      const w = canvas.width / (window.devicePixelRatio || 1);
      const h = canvas.height / (window.devicePixelRatio || 1);

      if (draggedPlayer) {
        const newX = ((coords.x - touchOffset.x) / w) * 100;
        const newY = ((coords.y - touchOffset.y) / h) * 100;
        draggedPlayer.x = Math.max(2, Math.min(98, newX));
        draggedPlayer.y = Math.max(2, Math.min(98, newY));
        render();
      } else if (currentPath) {
        currentPath.points.push(coords);
        render();
      }
    }

    function handleEnd(e) {
      if (currentPath) {
        if (currentPath.points.length > 1) {
          drawings.push(currentPath);
        }
        currentPath = null;
        render();
      }
      draggedPlayer = null;
    }

    function eraseNearestPath(coords) {
      const threshold = 20;
      let removed = false;
      drawings = drawings.filter(path => {
        if (removed) return true;
        const isNear = path.points.some(pt => Math.hypot(pt.x - coords.x, pt.y - coords.y) < threshold);
        if (isNear) removed = true;
        return !isNear;
      });
      render();
    }

    // EVENT LISTENERS DEL CANVAS
    canvas.addEventListener("mousedown", handleStart);
    canvas.addEventListener("mousemove", handleMove);
    window.addEventListener("mouseup", handleEnd);

    canvas.addEventListener("touchstart", handleStart, { passive: false });
    canvas.addEventListener("touchmove", handleMove, { passive: false });
    canvas.addEventListener("touchend", handleEnd, { passive: false });

    // CONTROLES DE INTERFAZ
    document.getElementById("offense-select").addEventListener("change", (e) => {
      currentOffenseKey = e.target.value;
      loadFormations(currentOffenseKey, currentDefenseKey);
      render();
    });

    document.getElementById("defense-select").addEventListener("change", (e) => {
      currentDefenseKey = e.target.value;
      loadFormations(currentOffenseKey, currentDefenseKey);
      render();
    });

    // BOTONES DE MODO
    const modeBtns = {
      move: document.getElementById("mode-move"),
      draw: document.getElementById("mode-draw"),
      erase: document.getElementById("mode-erase")
    };

    Object.keys(modeBtns).forEach(key => {
      modeBtns[key].addEventListener("click", () => {
        activeMode = key;
        Object.values(modeBtns).forEach(btn => {
          btn.className = "mode-btn text-slate-300 font-medium px-3 py-1 rounded-md hover:text-white transition flex items-center gap-1";
        });
        modeBtns[key].className = "mode-btn bg-blue-600 text-white font-bold px-3 py-1 rounded-md transition flex items-center gap-1 shadow";
      });
    });

    // BOTONES DE ESTILO DE LÍNEA
    const styleBtns = {
      arrow: document.getElementById("style-arrow"),
      solid: document.getElementById("style-solid"),
      dashed: document.getElementById("style-dashed")
    };

    Object.keys(styleBtns).forEach(key => {
      styleBtns[key].addEventListener("click", () => {
        lineStyle = key;
        Object.values(styleBtns).forEach(btn => {
          btn.className = "style-btn text-slate-300 hover:text-white px-2.5 py-1 rounded transition";
        });
        styleBtns[key].className = "style-btn bg-slate-700 text-white font-bold px-2.5 py-1 rounded transition shadow";
        // Si estábamos en modo mover, pasar automáticamente a modo dibujar al cambiar trazo
        if (activeMode !== "draw") modeBtns.draw.click();
      });
    });

    // PALETA DE COLORES
    const colorSwatches = document.querySelectorAll(".color-swatch");
    const customColorPicker = document.getElementById("custom-color-picker");

    colorSwatches.forEach(swatch => {
      swatch.addEventListener("click", () => {
        colorSwatches.forEach(s => s.classList.remove("active"));
        swatch.classList.add("active");
        strokeColor = swatch.dataset.color;
        customColorPicker.value = strokeColor;
        if (activeMode !== "draw") modeBtns.draw.click();
      });
    });

    customColorPicker.addEventListener("input", (e) => {
      strokeColor = e.target.value;
      colorSwatches.forEach(s => s.classList.remove("active"));
      if (activeMode !== "draw") modeBtns.draw.click();
    });

    // GROSOR DE LÍNEA
    document.getElementById("line-width-select").addEventListener("change", (e) => {
      strokeWidth = e.target.value;
    });

    // BOTONES DE ACCIÓN (LIMPIAR, RESETEAR, DESCARGAR)
    document.getElementById("btn-clear-draw").addEventListener("click", () => {
      drawings = [];
      render();
    });

    document.getElementById("btn-reset-board").addEventListener("click", () => {
      drawings = [];
      loadFormations(currentOffenseKey, currentDefenseKey);
      render();
    });

    document.getElementById("btn-download").addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = `jugada-${currentOffenseKey.toLowerCase()}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    // INICIAR AL CARGAR
    window.addEventListener("load", initBoard);
  </script>
